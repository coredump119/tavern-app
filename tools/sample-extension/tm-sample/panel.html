<div class="tm-sample-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>{{title}}</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <label class="checkbox_label">
        <input id="tm_sample_flag" type="checkbox" />
        <span>写进 extension_settings 的开关</span>
      </label>
      <div class="flex-container">
        <div id="tm_sample_popup" class="menu_button">弹个窗</div>
        <div id="tm_sample_toast" class="menu_button">弹个提示</div>
      </div>
      <ol id="tm_sample_log" class="tm-sample-log"></ol>
    </div>
  </div>
</div>
